<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Deliberate, licensed metric-compatible substitutions.
    These do NOT make Microsoft Aptos or Cambria Math present; they simply
    prevent LibreOffice/fontconfig from falling back to an arbitrary font with
    very different metrics. Exact missing fonts are reported in slide
    diagnostics so administrators are never told the render is high fidelity.
  -->

  <match target="pattern">
    <test qual="any" name="family"><string>Aptos</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Aptos Display</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="same"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Cambria Math</string></test>
    <edit name="family" mode="assign" binding="same"><string>Latin Modern Math</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
  </match>
</fontconfig>
