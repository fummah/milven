services:

  db:
    image: postgres:16
    container_name: milven_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - backend


  api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile

    container_name: milven_api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 4000

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

      JWT_SECRET: ${JWT_SECRET}

      CORS_ORIGIN: ${CORS_ORIGIN}
      WEB_BASE_URL: ${WEB_BASE_URL}

      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_FORCE_RESET: ${DEFAULT_ADMIN_FORCE_RESET}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

    volumes:
      - ./apps/server/uploads:/app/uploads

    expose:
      - "4000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend
      - frontend
      - web_proxy

    command: npm start


  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

      args:
        VITE_API_URL: ${VITE_API_URL}

    container_name: milven_frontend
    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - api

    networks:
      - frontend
      - web_proxy


volumes:
  db_data:


networks:

  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

  web_proxy:
    external: true
    name: web_proxy
